[package]
name = "vnt2"
version = "2.0.2"
edition = "2024"

[dependencies]
vnt-ipc = { path = "vnt-ipc", optional = true }
vnt-web = { path = "vnt-web", optional = true }
clap = { version = "4.5", features = ["derive", "env"] }

tokio = { workspace = true, features = ["full"] }


log.workspace = true
log4rs = "1.4"

serde.workspace = true
anyhow.workspace = true
toml.workspace = true
hostname.workspace = true
ipnet.workspace = true

route_manager.workspace = true

[features]
default = []
vnt-ipc = ["dep:vnt-ipc"]
vnt-web = ["dep:vnt-web"]

[[bin]]
name = "vnt2_cli"
path = "src/main_cli.rs"
required-features = ["vnt-ipc"]

[[bin]]
name = "vnt2_ctrl"
path = "src/main_ctrl.rs"
required-features = ["vnt-ipc"]

[[bin]]
name = "vnt2_web"
path = "src/main_web.rs"
required-features = ["vnt-web"]

[workspace]
members = ["vnt-web", "vnt-ipc", "vnt-core", "vnt-jni", "vnt-desktop/src-tauri"]

[workspace.dependencies]
vnt-core = { path = "vnt-core" }

tokio = "1"
tokio-util = "0.7"
futures = "0.3"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
log = "0.4"
toml = "0.9"
time = "0.3"
hostname = "0.4"
ipnet = { version = "2.11", features = ["serde"] }
route_manager = "0.2"
parking_lot = "0.12"
prost = "0.14"

[profile.release]
opt-level = 'z'
debug = 0
debug-assertions = false
strip = true
lto = true
incremental = false
codegen-units = 1
rpath = false
