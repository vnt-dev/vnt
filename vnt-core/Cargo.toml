[package]
name = "vnt-core"
version = "2.0.4"
edition = "2024"
license = "Apache-2.0"

[dependencies]

tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["codec"] }
futures.workspace = true

tun-rs = { version = "2", features = ["async", "async_framed"] }

rust-p2p-core = { version="0.4" }
tcp_ip = "0.2"

anyhow.workspace = true
parking_lot.workspace = true

quinn = { version = "0.11", default-features = false, features = ["rustls", "runtime-tokio"] }

tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
hex = "0.4"
sha2 = "0.11"
rustls-native-certs = "0.8.2"
log.workspace = true
bytes = "1.11.0"
rand = "0.10"
time = { workspace = true, features = ["macros", "formatting", "local-offset"] }
pnet_packet = "0.35"
pnet_base = "0.35"
ring = "0.17.14"
subtle = "2.6"

prost.workspace = true
tokio-tungstenite = "0.30"
tungstenite = "0.30"
uuid = { version = "1.18.1", features = ["v4"] }
ipnet.workspace = true
getifaddrs = "0.6.0"
dns-parser = "0.8"

lz4_flex = "0.14"
reed-solomon-erasure = "6.0"

serde.workspace = true
rcgen = "0.14.6"

zerocopy = { version = "0.8.31", features = ["derive"] }
socket2 = { version = "0.6.1", features = ["all"] }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", features = ["winreg"] }
widestring = "1.2"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
machine-uid = "0.6"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
